# What `envcloak agents status` reports for each pinned tier-1 host, as
# CI's coverage probes found it (M2 plan task M2-09; SPEC §7.1, gate 38):
# per host version and system, each surface's state, its reason tokens and
# its probe outcome, and EnvCloak's server line, in an isolated home with
# EnvCloak installed by `envcloak agents install` and nothing switched
# off. crates/envcloak-e2e/tests/probes.rs runs the probes on the pinned
# hosts and fails when what they observe, or what `agents status` then
# reports, differs from a row here; a change is made here with the run
# that measured it, never by loosening the test. docs/INSTALLERS.md
# ("Coverage") explains each value, and M2 plan §4's S4 takes its expected
# tokens from here.
#
# Codex's hook probes run with `--dangerously-bypass-hook-trust`, standing
# for the person's trust in `/hooks`, in the probe home only; a person's
# own hooks still read `hooks_untrusted`, since Codex records their trust
# where EnvCloak cannot read it.
#
# The transcript probe runs the hosts as every probe does, `claude -p` and
# `codex exec`, neither of which writes the prompt history their
# interactive sessions keep (`history.jsonl`; measured on both pins,
# docs/AGENTS.md): what it found is for the stores those modes write, and
# the interactive history is a case not run here (`interactive_history
# skipped`), which M2-26's interactive variant covers. Codex's `probe=passed`
# says that `codex exec` keeps a blocked prompt in none of its stores, not
# that its interactive sessions keep it out of their history.

[[host]]
id = "claude-code"
version = "2.1.280"

# Claude Code's file read: EnvCloak's `Read(**/.env*)` deny rule refuses
# the `Read` of the project's `.env` (named by its resolved path, the
# session's working directory) before any hook, in the host's own words:
# the rule's case. The rule matches within the working directory only, so
# a `.env` outside it reaches EnvCloak's hook, which refuses it with its
# marker: the hook's case, measured as the hook's (M2 plan M2-09; the
# same rule as Codex's probes, which leave EnvCloak's `forbidden` rules
# their own case).
[host.macos]
prompt_to_model = "degraded (fails_open_on_timeout, workspace_untrusted; probe=passed)"
transcript = "unsupported (persists_blocked_prompt; probe=failed, interactive_history skipped)"
file_read = "degraded (fails_open_on_timeout, workspace_untrusted; probe=passed)"
shell = "degraded (fails_open_on_timeout, workspace_untrusted; probe=passed)"
mcp = "degraded (fails_open_on_timeout, workspace_untrusted; probe=passed)"
output = "active (probe=passed)"
envcloak_server = "needs_host_approval; outside_host_sandbox (probe=passed, sentinel appeared)"

# The server line on Linux is measured outside a user namespace (CI's
# "Probe sentinels outside a user namespace" step): inside CI's, Claude
# Code's sandboxed shell cannot start, and the sentinel probe fails
# through its shell's run witness.
[host.linux]
prompt_to_model = "degraded (fails_open_on_timeout, workspace_untrusted; probe=passed)"
transcript = "unsupported (persists_blocked_prompt; probe=failed, interactive_history skipped)"
file_read = "degraded (fails_open_on_timeout, workspace_untrusted; probe=passed)"
shell = "degraded (fails_open_on_timeout, workspace_untrusted; probe=passed)"
mcp = "degraded (fails_open_on_timeout, workspace_untrusted; probe=passed)"
output = "active (probe=passed)"
envcloak_server = "needs_host_approval; outside_host_sandbox (probe=passed, sentinel appeared)"

