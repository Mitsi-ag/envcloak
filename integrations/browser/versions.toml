version = "22.23.3"

[node.url]
darwin-arm64 = "https://nodejs.org/dist/v{version}/node-v{version}-darwin-arm64.tar.gz"
linux-x64 = "https://nodejs.org/dist/v{version}/node-v{version}-linux-x64.tar.xz"

