name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The gate 19 crash test runs its positive core-dump control only when
      # core files go to a known directory, which it checks and cleans up.
      # In CI it fails if the control cannot run.
      - name: Route core dumps to a known directory (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/eccores
          sudo sysctl -w kernel.core_pattern=/tmp/eccores/core.%p
          echo "ENVCLOAK_TEST_CORE_DIR=/tmp/eccores" >> "$GITHUB_ENV"
      - name: Route core dumps to a known directory (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo mkdir -p /cores
          sudo chmod 1777 /cores
          sudo sysctl -w kern.coredump=1
          sudo sysctl -w kern.corefile=/cores/core.%P
          echo "ENVCLOAK_TEST_CORE_DIR=/cores" >> "$GITHUB_ENV"
      # Gates 20 and 21 need a second user to own a directory, connect
      # from another uid and squat on a socket (T7). sudo is passwordless on
      # the runners.
      - name: Create a second user (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo useradd --no-create-home --shell /usr/sbin/nologin ecother
          sudo -n -u ecother true
          echo "ENVCLOAK_TEST_OTHER_USER=ecother" >> "$GITHUB_ENV"
      # `envcloak daemon install` is tested under the real service manager:
      # a systemd user manager (lingering keeps it up without a login) on
      # Linux, launchd on macOS.
      - name: Start a systemd user manager (Linux)
        if: runner.os == 'Linux'
        run: |
          uid="$(id -u)"
          sudo loginctl enable-linger "$USER"
          for _ in $(seq 1 100); do
            [ -S "/run/user/$uid/bus" ] && break
            sleep 0.1
          done
          XDG_RUNTIME_DIR="/run/user/$uid" systemctl --user show-environment >/dev/null
          echo "ENVCLOAK_TEST_SERVICE_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "ENVCLOAK_TEST_SERVICE_MANAGER=1" >> "$GITHUB_ENV"
      - name: Allow the launchd test (macOS)
        if: runner.os == 'macOS'
        run: echo "ENVCLOAK_TEST_SERVICE_MANAGER=1" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - name: Unsafe-code and secret-exposure boundaries
        run: |
          python3 --version
          scripts/check-unsafe.sh
      - run: cargo clippy --workspace --all-targets --locked
      # The shipped binaries' own configuration: release profile, no
      # test-only features. Code compiled only there is linted too.
      - run: cargo clippy --release --locked
      - name: Compiled sources are the scanned sources
        run: scripts/check-sources.sh
      - name: expose_secret lint canary
        run: scripts/check-expose-lint.sh
      - name: unsafe_code forbid canary
        run: scripts/check-unsafe-lint.sh
      - run: cargo test --workspace --locked --no-fail-fast

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
