name: CI

# Two depths. Pull requests (working branches) run the fast suite on Linux:
# every lint and boundary check and every test except the end-to-end
# fixture story and the release-build job. Pushes to main, the nightly run and
# manual runs keep the full suite, so nothing merged skips a gate.
#
# The M2 trigger table (M2 plan §6, landed by task M2-04):
#
# | Trigger      | Linux                                       | macOS                  |
# |--------------|---------------------------------------------|------------------------|
# | Pull request | lint, unit and integration as above; the    | `macos-app` when       |
# |              | path-filtered `gates` job (the story steps  | ci-paths.py's `app`    |
# |              | in crates/envcloak-e2e/tests/m2_story/ with | answer says the change |
# |              | the pinned hosts); `agents-e2e` when        | reaches the app (M3    |
# |              | envcloak-agents, envcloak-mcp, the agent    | plan §5 rule 8), with  |
# |              | harness or integrations/ change             | no UI tests; no other  |
# |              |                                             | macOS job: a task on   |
# |              |                                             | other macOS paths      |
# |              |                                             | links a green manual   |
# |              |                                             | run of its gate        |
# |              |                                             | modules on its branch  |
# | Push to main | everything, `agents-e2e` with the stories   | the same, `macos-app`  |
# |              |                                             | with its UI tests      |
# | Nightly      | everything, `release-check-models`          | the same               |
# | Manual       | everything                                  | the same               |
#
# The agent hosts run with loopback only: on Linux in a network namespace
# (`unshare -rn`), on macOS with a group of their own whose packets to
# anywhere but lo0 a pf rule refuses and which the system resolver's
# socket refuses. Each job first checks that the network is open outside
# that (a name resolves, an outside address answers), and then that it is
# not inside (ENVCLOAK_TEST_NETWORK, `the_network_is_what_ci_says`). A main
# run is never cancelled by the next merge, nor replaced while it waits:
# runs other than a pull request's each get a concurrency group of their
# own (GitHub cancels a pending run when another joins its group), and
# only pull-request runs cancel their predecessors.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  FULL: ${{ github.event_name != 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run Linux only: every change is tested on macOS
        # locally before it is pushed, and Linux is what a Mac cannot run.
        # Main, nightly and manual runs test both.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The hook's glob oracle (crates/envcloak-agents/tests/
      # grep_glob_oracle.rs) asks ripgrep which file a glob picks out; it
      # fails here if ripgrep is missing. Its shell oracle (shell_oracle.rs)
      # runs every spelling in bash, sh, dash and zsh (zsh is the shell of
      # Claude Code's Bash tool on macOS), and fails here if one is missing.
      # Its program oracle (program_oracle.rs) runs readers' programs with
      # sed, awk (mawk and gawk on Linux), jq and yq, and fails here if sed,
      # awk or jq is missing.
      - name: Install ripgrep, the shells and the readers
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y --no-install-recommends ripgrep zsh dash gawk jq
          else
            command -v rg >/dev/null || brew install ripgrep
            command -v jq >/dev/null || brew install jq
          fi
          rg --version
          echo "ENVCLOAK_TEST_REQUIRE_RG=1" >> "$GITHUB_ENV"
          echo "ENVCLOAK_TEST_REQUIRE_SHELLS=bash,sh,dash,zsh" >> "$GITHUB_ENV"
          echo "ENVCLOAK_TEST_REQUIRE_TOOLS=sed,awk,jq" >> "$GITHUB_ENV"
      # The gate 19 crash test runs its positive core-dump control only when
      # core files go to a known directory, which it checks and cleans up.
      # In CI it fails if the control cannot run.
      - name: Route core dumps to a known directory (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/eccores
          sudo sysctl -w kernel.core_pattern=/tmp/eccores/core.%p
          echo "ENVCLOAK_TEST_CORE_DIR=/tmp/eccores" >> "$GITHUB_ENV"
      - name: Route core dumps to a known directory (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo mkdir -p /cores
          sudo chmod 1777 /cores
          sudo sysctl -w kern.coredump=1
          sudo sysctl -w kern.corefile=/cores/core.%P
          echo "ENVCLOAK_TEST_CORE_DIR=/cores" >> "$GITHUB_ENV"
      # Gates 20 and 21 need a second user to own a directory, connect
      # from another uid and squat on a socket (T7). sudo is passwordless on
      # the runners.
      - name: Create a second user (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo useradd --no-create-home --shell /usr/sbin/nologin ecother
          sudo -n -u ecother true
          echo "ENVCLOAK_TEST_OTHER_USER=ecother" >> "$GITHUB_ENV"
      # `envcloak daemon install` is tested under the real service manager:
      # a systemd user manager (lingering keeps it up without a login) on
      # Linux, launchd on macOS.
      - name: Start a systemd user manager (Linux)
        if: runner.os == 'Linux'
        run: |
          uid="$(id -u)"
          sudo loginctl enable-linger "$USER"
          for _ in $(seq 1 100); do
            [ -S "/run/user/$uid/bus" ] && break
            sleep 0.1
          done
          XDG_RUNTIME_DIR="/run/user/$uid" systemctl --user show-environment >/dev/null
          echo "ENVCLOAK_TEST_SERVICE_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "ENVCLOAK_TEST_SERVICE_MANAGER=1" >> "$GITHUB_ENV"
      # Gate 27's real-process test runs in a user and pid namespace, where
      # it can hand a pid out again. Ubuntu's AppArmor strips capabilities
      # from unprivileged user namespaces unless this is off.
      - name: Allow unprivileged user namespaces (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --pid --fork --mount-proc sh -c 'echo 1 >/proc/sys/kernel/ns_last_pid'
      - name: Allow the launchd test (macOS)
        if: runner.os == 'macOS'
        run: echo "ENVCLOAK_TEST_SERVICE_MANAGER=1" >> "$GITHUB_ENV"
      # Gate 8 feeds the output of real serializers through the runner
      # (crates/envcloak-exec/tests/runner.rs) and, in the fixture story,
      # through the whole of `envcloak run` (crates/envcloak-e2e): Python,
      # Node, Go, .NET and PHP are set up on both systems and required, so
      # a missing one fails the gate instead of narrowing it.
      # Full runs require every serializer. Node also runs the independent
      # TOTP oracle on pull requests; other runtimes can be preinstalled.
      - uses: actions/setup-python@v5
        if: env.FULL == 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        if: env.FULL == 'true'
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-dotnet@v4
        if: env.FULL == 'true'
        with:
          dotnet-version: "8.0.x"
      - uses: shivammathur/setup-php@v2
        if: env.FULL == 'true'
        with:
          php-version: "8.3"
          coverage: none
          tools: none
      - name: Serializers gate 8 requires
        if: env.FULL == 'true'
        run: |
          python3 --version
          node --version
          go version
          dotnet --version
          php --version
          echo "ENVCLOAK_TEST_REQUIRE_SERIALIZERS=node,go,php" >> "$GITHUB_ENV"
          echo "ENVCLOAK_TEST_REQUIRE_EMITTERS=python,node,go,dotnet,php,serde" >> "$GITHUB_ENV"
          echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      # M2 plan task M2-01: the names and numbers reserved for the M2 and
      # M2b tasks (decision D-23), checked against each other and against
      # the code, and the build decisions SPEC v0.4 wrote down.
      - name: Reserved registries and SPEC decisions
        run: |
          python3 scripts/check-reservations.py
          python3 scripts/check-spec-decisions.py
      - name: Unsafe-code and secret-exposure boundaries
        run: |
          python3 --version
          scripts/check-unsafe.sh
      - run: cargo clippy --workspace --all-targets --locked
      # The shipped binaries' own configuration: release profile, no
      # test-only features. Code compiled only there is linted too.
      - run: cargo clippy --release --locked
      - name: Compiled sources are the scanned sources
        run: scripts/check-sources.sh
      - name: expose_secret lint canary
        run: scripts/check-expose-lint.sh
      - name: SHA-1 TOTP confinement canary
        run: scripts/check-totp-lint.sh
      - name: TOTP oracle runner controls
        run: python3 -I -B crates/envcloak-signin/tests/oracles/test_totp_oracle.py
      - name: Independent TOTP oracle and fixture freshness
        run: scripts/check-totp-oracle.sh
      - name: unsafe_code forbid canary
        run: scripts/check-unsafe-lint.sh
      # Gate 12: the whole suite at RUST_LOG=trace with full backtraces;
      # TestHome passes both on to every process the tests start. Nothing
      # reads RUST_LOG yet (no logger); it is set so logging added later is
      # swept at its most verbose. The gate rests on each test's sweep of
      # what it captured, and crates/envcloak-e2e's injected panics,
      # malformed inputs holding fixtures, and the fixture story.
      - name: cargo test --workspace (RUST_LOG=trace)
        env:
          RUST_LOG: trace
          RUST_BACKTRACE: full
        run: |
          if [ "$FULL" = "true" ]; then
            cargo test --workspace --locked --no-fail-fast
          else
            # The fixture story and gate 12's release run are in
            # envcloak-e2e; they run on main, nightly and on demand.
            cargo test --workspace --locked --no-fail-fast --exclude envcloak-e2e
            # Gate 39 is end to end: the managed-server tests (M2 task
            # M2-27) run on pull requests too.
            cargo test --locked -p envcloak-e2e --no-fail-fast --test managed_launch --test managed_runner
          fi
      # M2-19's job-control gate through the whole of `envcloak run --pty`
      # (crates/envcloak-e2e/tests/pty_job_control.rs) on pull requests
      # too: an outer job-control shell on a terminal of the test's own, a
      # daemon and the fixture project, no agent host. On full runs it is
      # part of the step above.
      - name: PTY job control through envcloak run --pty (pull requests)
        if: env.FULL != 'true'
        env:
          RUST_LOG: trace
          RUST_BACKTRACE: full
        run: cargo test --locked -p envcloak-e2e --test pty_job_control --no-fail-fast

  managed-oracles:
    name: managed runtime oracles (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: managed-oracles
      - uses: actions/setup-node@v4
        with:
          node-version: "26.7.0"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/managed-oracles
          key: managed-oracles-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/provision-managed-oracles.py') }}
      - name: Build pinned PHP, debug CPython and npm oracles
        run: python3 -B scripts/provision-managed-oracles.py "$RUNNER_TEMP/managed-oracles"
      - name: Require every runtime oracle and its execution controls
        run: |
          python3 -B scripts/test-managed-oracles.py
          scripts/check-managed-oracles.sh

  # The shipped binaries as `cargo build --release` makes them: panic =
  # "abort" and no core file (gate 19), no test hook, a truthful `status`,
  # and the fixture story and gate 12 run on them
  # (crates/envcloak-e2e/tests/release.rs), then story step S0 with the
  # pinned hosts.
  release:
    name: release (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Route core dumps to a known directory (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/eccores
          sudo sysctl -w kernel.core_pattern=/tmp/eccores/core.%p
          echo "ENVCLOAK_TEST_CORE_DIR=/tmp/eccores" >> "$GITHUB_ENV"
      - name: Route core dumps to a known directory (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo mkdir -p /cores
          sudo chmod 1777 /cores
          sudo sysctl -w kern.coredump=1
          sudo sysctl -w kern.corefile=/cores/core.%P
          echo "ENVCLOAK_TEST_CORE_DIR=/cores" >> "$GITHUB_ENV"
      # The service manager's restart (crates/envcloak-e2e/tests/
      # managed_runner.rs) runs on the shipped binaries too: a systemd user
      # manager on Linux, launchd on macOS. The test fails on Actions
      # without it.
      - name: Start a systemd user manager (Linux)
        if: runner.os == 'Linux'
        run: |
          uid="$(id -u)"
          sudo loginctl enable-linger "$USER"
          for _ in $(seq 1 100); do
            [ -S "/run/user/$uid/bus" ] && break
            sleep 0.1
          done
          XDG_RUNTIME_DIR="/run/user/$uid" systemctl --user show-environment >/dev/null
          echo "ENVCLOAK_TEST_SERVICE_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "ENVCLOAK_TEST_SERVICE_MANAGER=1" >> "$GITHUB_ENV"
      - name: Allow the launchd test (macOS)
        if: runner.os == 'macOS'
        run: echo "ENVCLOAK_TEST_SERVICE_MANAGER=1" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: none
      - name: Build the release binaries and the test build's controls
        run: |
          cargo build --release --locked
          # envcloak-agents: agent_hosts checks that the scripted model's
          # sentinel is in it and in neither release binary.
          cargo build --locked -p envcloak -p envcloakd -p envcloak-agents -p envcloak-testkit --bins
      - name: Release checks, gate 12 and the fixture story on the release binaries
        env:
          RUST_LOG: trace
          RUST_BACKTRACE: full
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          ENVCLOAK_TEST_REQUIRE_EMITTERS: python,node,go,dotnet,php,serde
          ENVCLOAK_TEST_REQUIRE_RELEASE: "1"
        run: |
          export ENVCLOAK_TEST_RELEASE_DIR="$PWD/target/release"
          export ENVCLOAK_E2E_BIN_DIR="$PWD/target/release"
          cargo test --locked -p envcloak-e2e --no-fail-fast
      # Story step S0 on the release binaries (M2 plan §6: the release job
      # runs the stories on release binaries), with the pinned hosts
      # required, at trace with full backtraces, and loopback only, as
      # agents-e2e runs it on the test build. The step above finds no host
      # (the cache is not where it looks), so S0 runs here only.
      - name: Agent hosts from the cache, keyed by their pins
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../agent-hosts
          key: agent-hosts-${{ runner.os }}-${{ hashFiles('crates/envcloak-e2e/agents/**', 'crates/envcloak-e2e/mcp-client/package*.json', 'scripts/install-agent-hosts.py') }}
      - name: Install and verify the pinned tier-1 hosts
        env:
          ENVCLOAK_AGENT_HOSTS: ${{ github.workspace }}/../agent-hosts
        run: |
          python3 scripts/install-agent-hosts.py --self-test
          python3 scripts/install-agent-hosts.py --tier 1 --mcp-client
      - name: Claude Code's sandbox dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends bubblewrap socat
      - name: Allow unprivileged user namespaces (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Build S0 for the release binaries
        run: cargo test --locked -p envcloak-e2e --test m2_story --no-run
      # The positive control: --exact runs nothing for a name no test has,
      # and passes, so the step also requires that the one test ran and passed.
      - name: The network outside the isolation is open
        env:
          ENVCLOAK_TEST_NETWORK: open
        run: |
          set -o pipefail
          cargo test --locked --offline -p envcloak-e2e --test m2_story -- --exact \
            the_network_is_what_ci_says 2>&1 | tee "$RUNNER_TEMP/network-open.log"
          grep -qx 'running 1 test' "$RUNNER_TEMP/network-open.log"
          grep -q '^test result: ok. 1 passed; 0 failed' "$RUNNER_TEMP/network-open.log"
      # S7 and S8 run here too: every gate-8 serializer through
      # run_with_secrets, required, with the Go and .NET emitters the
      # fixture story built above (crates/envcloak-e2e/tests/m2_story/mcp.rs,
      # story_emitters).
      - name: S0 on the release binaries, loopback only (Linux)
        if: runner.os == 'Linux'
        env:
          ENVCLOAK_AGENT_HOSTS: ${{ github.workspace }}/../agent-hosts
          ENVCLOAK_TEST_REQUIRE_AGENT_HOSTS: "1"
          ENVCLOAK_TEST_REQUIRE_EMITTERS: python,node,go,dotnet,php,serde
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          ENVCLOAK_E2E_BIN_DIR: ${{ github.workspace }}/target/release
          ENVCLOAK_TEST_NETWORK: loopback-only
          RUST_LOG: trace
          RUST_BACKTRACE: full
        run: |
          unshare --user --map-root-user --net -- sh -ec \
            'ip link set lo up; exec cargo test --locked --offline -p envcloak-e2e --test m2_story -- --nocapture --test-threads=1'
      - name: S0 on the release binaries, sandboxed cases outside a user namespace, loopback only (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          ENVCLOAK_AGENT_HOSTS: ${{ github.workspace }}/../agent-hosts
          ENVCLOAK_TEST_REQUIRE_AGENT_HOSTS: "1"
          ENVCLOAK_E2E_BIN_DIR: ${{ github.workspace }}/target/release
          ENVCLOAK_TEST_NETWORK: loopback-only
          RUST_LOG: trace
          RUST_BACKTRACE: full
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" "HOME=$HOME" unshare --net -- sh -ec \
            "ip link set lo up; exec setpriv --reuid=$(id -u) --regid=$(id -g) --init-groups -- \
             cargo test --locked --offline -p envcloak-e2e --test m2_story -- --nocapture --test-threads=1 \
             --exact skeleton::s0_claude_code_sandboxed skeleton::s0_codex_workspace_write \
             the_network_is_what_ci_says" 2>&1 | tee "$RUNNER_TEMP/s0-outside.log"
          grep -qx 'running 3 tests' "$RUNNER_TEMP/s0-outside.log"
          grep -q '^test result: ok. 3 passed; 0 failed' "$RUNNER_TEMP/s0-outside.log"
      # As agents-e2e: the tests' own group, whose packets to anywhere but
      # lo0 a pf rule refuses, and which the resolver's socket refuses.
      - name: Loopback only for the tests' group (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo dscl . -create /Groups/ecnonet
          sudo dscl . -create /Groups/ecnonet PrimaryGroupID 4242
          printf '%s\n' 'pass quick on lo0 all flags any no state' \
            'block return out quick proto { tcp udp } all group 4242' \
            | sudo pfctl -a com.apple/ecnonet -f -
          sudo pfctl -E
          sudo pfctl -a com.apple/ecnonet -s rules
          # Name lookups through getaddrinfo too: the system's resolver takes
          # them on its socket and sends the queries itself, outside the
          # group; an access control entry denies the group that socket, so
          # such a lookup fails before any query is made for it. Lookups
          # over the resolver's XPC service (Network.framework, URLSession)
          # are not refused: agent_hosts.rs checks that no pinned host
          # imports one, by static imports only (a framework loaded at run
          # time is not seen; docs/ACCEPTANCE.md).
          sudo chmod +a "group:ecnonet deny write,append" /var/run/mDNSResponder
          /bin/ls -le /var/run/mDNSResponder
      - name: S0 on the release binaries, loopback only (macOS)
        if: runner.os == 'macOS'
        env:
          ENVCLOAK_AGENT_HOSTS: ${{ github.workspace }}/../agent-hosts
          ENVCLOAK_TEST_REQUIRE_AGENT_HOSTS: "1"
          ENVCLOAK_TEST_REQUIRE_EMITTERS: python,node,go,dotnet,php,serde
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          ENVCLOAK_E2E_BIN_DIR: ${{ github.workspace }}/target/release
          ENVCLOAK_TEST_NETWORK: loopback-only
          RUST_LOG: trace
          RUST_BACKTRACE: full
        run: |
          sudo -E env -u SUDO_COMMAND -u SUDO_USER -u SUDO_UID -u SUDO_GID \
            "PATH=$PATH" "HOME=$HOME" "USER=$USER" "LOGNAME=$USER" \
            "$(command -v python3)" -c 'import os, sys; os.setgroups([4242]); os.setgid(4242); os.setuid(int(sys.argv[1])); os.execvp(sys.argv[2], sys.argv[2:])' \
            "$(id -u)" cargo test --locked --offline -p envcloak-e2e --test m2_story -- --nocapture --test-threads=1

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The crate graph is one-way (M2 plan D-02, F-75): every normal edge
  # between workspace crates is in scripts/check-crate-graph.py's
  # allowed-edge table, no forbidden edge and no cycle, checked before
  # anything is built; then the workspace checks with its default features
  # and with every feature.
  crate-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: crate-graph
      - name: Crate graph
        run: |
          python3 --version
          python3 scripts/check-crate-graph.py
      - run: cargo check --workspace --all-targets --locked
      - run: cargo check --workspace --all-targets --all-features --locked
      # The combined-graph gate (M2 plan F-75, M2-08): the agent catalog,
      # the scanner, the MCP server and the CLI with no default features
      # too.
      - run: cargo check -p envcloak-agents -p envcloak-scan -p envcloak-mcp -p envcloak --all-targets --no-default-features --locked

  # Which of the M2 agent jobs and the macOS app job a pull request needs,
  # from the paths it changes (scripts/ci-paths.py, which checks its own
  # table of paths first). Every other event runs them all.
  changes:
    runs-on: ubuntu-latest
    outputs:
      gates: ${{ steps.paths.outputs.gates }}
      agents: ${{ steps.paths.outputs.agents }}
      app: ${{ steps.paths.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/ci-paths.py --self-test
          if [ "$EVENT" != "pull_request" ]; then
            echo "gates=true" >> "$GITHUB_OUTPUT"
            echo "agents=true" >> "$GITHUB_OUTPUT"
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE"...HEAD)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | python3 scripts/ci-paths.py | tee -a "$GITHUB_OUTPUT"

  # The story steps the task being landed adds (M2 plan §6): the m2_story
  # target, with the pinned Claude Code and Codex from the host cache, on
  # Linux with loopback only. Pull requests only; main runs them in
  # `agents-e2e` on both systems.
  gates:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.gates == 'true'
    runs-on: ubuntu-latest
    env:
      ENVCLOAK_AGENT_HOSTS: ${{ github.workspace }}/../agent-hosts
      ENVCLOAK_TEST_REQUIRE_AGENT_HOSTS: "1"
      # Gate 12 on the hosts' paths too: every process the tests start,
      # the hosts and the `envcloak run` they start included, runs at
      # trace with full backtraces, and the tests sweep what they capture.
      RUST_LOG: trace
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: agents
      # No setup-node: the installer puts the Node.js versions.toml pins
      # (version, archive and binary SHA-256) in the host cache, runs npm
      # with it, and the harness runs every node host with it.
      - name: Agent hosts from the cache, keyed by their pins
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../agent-hosts
          key: agent-hosts-${{ runner.os }}-${{ hashFiles('crates/envcloak-e2e/agents/**', 'crates/envcloak-e2e/mcp-client/package*.json', 'scripts/install-agent-hosts.py') }}
      - name: Install and verify the pinned tier-1 hosts
        run: |
          python3 scripts/install-agent-hosts.py --self-test
          python3 scripts/install-agent-hosts.py --tier 1 --mcp-client
      # S0's sandboxed Claude Code case: its Bash sandbox needs bubblewrap
      # and socat on Linux (https://code.claude.com/docs/en/sandboxing).
      - name: Claude Code's sandbox dependencies
        run: sudo apt-get install -y --no-install-recommends bubblewrap socat
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Build
        run: |
          cargo build --locked -p envcloak -p envcloakd -p envcloak-agents -p envcloak-testkit -p envcloak-e2e --bins
          cargo test --locked -p envcloak-e2e --test m2_story --no-run
      # The positive control: --exact runs nothing for a name no test has,
      # and passes, so the step also requires that the one test ran and passed.
      - name: The network outside the namespace is open
        env:
          ENVCLOAK_TEST_NETWORK: open
        run: |
          set -o pipefail
          cargo test --locked --offline -p envcloak-e2e --test m2_story -- --exact \
            the_network_is_what_ci_says 2>&1 | tee "$RUNNER_TEMP/network-open.log"
          grep -qx 'running 1 test' "$RUNNER_TEMP/network-open.log"
          grep -q '^test result: ok. 1 passed; 0 failed' "$RUNNER_TEMP/network-open.log"
      - name: Story steps, loopback only
        env:
          ENVCLOAK_TEST_NETWORK: loopback-only
        run: |
          unshare --user --map-root-user --net -- sh -ec \
            'ip link set lo up; exec cargo test --locked --offline -p envcloak-e2e --test m2_story -- --nocapture --test-threads=1'
      # S0's sandboxed cases again outside a user namespace, as a person's
      # machine runs them (K-01: the CLI's own refusal, where Claude Code's
      # sandbox applies its seccomp filter).
      # --exact runs nothing for a name no test has, and passes: the step
      # then also requires that all three ran and passed.
      - name: Story steps, sandboxed cases outside a user namespace, loopback only
        if: ${{ !cancelled() }}
        env:
          ENVCLOAK_TEST_NETWORK: loopback-only
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" "HOME=$HOME" unshare --net -- sh -ec \
            "ip link set lo up; exec setpriv --reuid=$(id -u) --regid=$(id -g) --init-groups -- \
             cargo test --locked --offline -p envcloak-e2e --test m2_story -- --nocapture --test-threads=1 \
             --exact skeleton::s0_claude_code_sandboxed skeleton::s0_codex_workspace_write \
             the_network_is_what_ci_says" 2>&1 | tee "$RUNNER_TEMP/s0-outside.log"
          grep -qx 'running 3 tests' "$RUNNER_TEMP/s0-outside.log"
          grep -q '^test result: ok. 3 passed; 0 failed' "$RUNNER_TEMP/s0-outside.log"

  # The pinned agent hosts against the scripted model (M2-04's harness,
  # probes and measurements; later tasks add theirs). Linux on pull
  # requests that touch envcloak-agents, envcloak-mcp, the harness or
  # integrations/; both systems, with the story steps, on main, nightly
  # and manual runs. `measurement:` lines feed docs/AGENTS.md.
  agents-e2e:
    needs: changes
    if: needs.changes.outputs.agents == 'true'
    name: agents-e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    env:
      ENVCLOAK_AGENT_HOSTS: ${{ github.workspace }}/../agent-hosts
      ENVCLOAK_TEST_REQUIRE_AGENT_HOSTS: "1"
      # agent_hosts (M2-04's measurements) and probes (M2-09's coverage
      # probes on the pinned hosts, and the published matrix they are held
      # to), and probe_local (M2-28's probes on a person's machine, against
      # a stand-in host) on every run; the story steps on main, nightly and
      # manual runs.
      TESTS: ${{ github.event_name == 'pull_request' && '--test agent_hosts --test probes --test probe_local' || '--test agent_hosts --test probes --test probe_local --test m2_story' }}
      # Gate 12 on the hosts' paths too (see the gates job).
      RUST_LOG: trace
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: agents
      # No setup-node: the installer puts the Node.js versions.toml pins
      # (version, archive and binary SHA-256) in the host cache, runs npm
      # with it, and the harness runs every node host with it. The Chrome
      # for Testing cache M2-04's CI scope also lists is deferred to M2b-02,
      # which pins the browser (integrations/browser/versions.toml) and is
      # the first task to run one; no job before it starts a browser.
      - name: Agent hosts from the cache, keyed by their pins
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../agent-hosts
          key: agent-hosts-${{ runner.os }}-${{ hashFiles('crates/envcloak-e2e/agents/**', 'crates/envcloak-e2e/mcp-client/package*.json', 'scripts/install-agent-hosts.py') }}
      - name: Install and verify the pinned hosts (tier 1 and tier 2)
        run: |
          python3 scripts/install-agent-hosts.py --self-test
          python3 scripts/install-agent-hosts.py --tier all --mcp-client
      # Claude Code's Bash sandbox needs bubblewrap and socat on Linux
      # (https://code.claude.com/docs/en/sandboxing); without them the
      # sandbox measurements read "the host did not run".
      - name: Claude Code's sandbox dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends bubblewrap socat
      - name: Allow unprivileged user namespaces (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Build
        run: |
          cargo build --locked -p envcloak -p envcloakd -p envcloak-agents -p envcloak-testkit -p envcloak-e2e --bins
          cargo test --locked -p envcloak-e2e $TESTS --no-run
      # The positive control: --exact runs nothing for a name no test has,
      # and passes, so the step also requires that the one test ran and passed.
      - name: The network outside the isolation is open
        env:
          ENVCLOAK_TEST_NETWORK: open
        run: |
          set -o pipefail
          cargo test --locked --offline -p envcloak-e2e --test agent_hosts -- --exact \
            the_network_is_what_ci_says 2>&1 | tee "$RUNNER_TEMP/network-open.log"
          grep -qx 'running 1 test' "$RUNNER_TEMP/network-open.log"
          grep -q '^test result: ok. 1 passed; 0 failed' "$RUNNER_TEMP/network-open.log"
      - name: Agent hosts, loopback only (Linux)
        if: runner.os == 'Linux'
        env:
          ENVCLOAK_TEST_NETWORK: loopback-only
        run: |
          unshare --user --map-root-user --net -- sh -ec \
            "ip link set lo up; exec cargo test --locked --offline -p envcloak-e2e $TESTS -- --nocapture --test-threads=1"
      # The sandbox rows of K-01 again outside a user namespace, as a
      # person's machine runs them: Claude Code's Linux sandbox applies its
      # seccomp filter (the one that blocks Unix sockets) through a helper
      # that writes /proc/self/uid_map, which it cannot do inside the user
      # namespace above. Root makes a network namespace with loopback only,
      # and the tests run in it as the runner's own user.
      - name: Agent host sandboxes outside a user namespace, loopback only (Linux)
        # Measured even when a step above failed, so a failing run still
        # records these rows.
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          ENVCLOAK_TEST_NETWORK: loopback-only
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" "HOME=$HOME" unshare --net -- sh -ec \
            "ip link set lo up; exec setpriv --reuid=$(id -u) --regid=$(id -g) --init-groups -- \
             cargo test --locked --offline -p envcloak-e2e --test agent_hosts -- --nocapture --test-threads=1 \
             --exact claude_code_sandbox_reaches_the_socket codex_sandbox_reaches_the_socket_and_nothing_else \
             the_network_is_what_ci_says" 2>&1 | tee "$RUNNER_TEMP/k01-outside.log"
          grep -qx 'running 3 tests' "$RUNNER_TEMP/k01-outside.log"
          grep -q '^test result: ok. 3 passed; 0 failed' "$RUNNER_TEMP/k01-outside.log"
      # The coverage probes' sentinels the same way (M2-09): Claude Code's
      # sandboxed shell cannot start inside the user namespace above, where
      # its sentinel probe fails through its shell's run witness; the Linux
      # server lines of integrations/compat/matrix.toml are this step's.
      - name: Probe sentinels outside a user namespace, loopback only (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          ENVCLOAK_TEST_NETWORK: loopback-only
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" "HOME=$HOME" unshare --net -- sh -ec \
            "ip link set lo up; exec setpriv --reuid=$(id -u) --regid=$(id -g) --init-groups -- \
             cargo test --locked --offline -p envcloak-e2e --test probes -- --nocapture --test-threads=1 \
             --exact claude_code_sentinel_is_what_its_probe_observes codex_sentinel_is_what_its_probe_observes \
             the_network_is_what_ci_says" 2>&1 | tee "$RUNNER_TEMP/sentinels-outside.log"
          grep -qx 'running 3 tests' "$RUNNER_TEMP/sentinels-outside.log"
          grep -q '^test result: ok. 3 passed; 0 failed' "$RUNNER_TEMP/sentinels-outside.log"
      # S0's sandboxed cases the same way (the gates job runs them on pull
      # requests), on main, nightly and manual runs.
      - name: Story steps, sandboxed cases outside a user namespace, loopback only (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' && github.event_name != 'pull_request' }}
        env:
          ENVCLOAK_TEST_NETWORK: loopback-only
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" "HOME=$HOME" unshare --net -- sh -ec \
            "ip link set lo up; exec setpriv --reuid=$(id -u) --regid=$(id -g) --init-groups -- \
             cargo test --locked --offline -p envcloak-e2e --test m2_story -- --nocapture --test-threads=1 \
             --exact skeleton::s0_claude_code_sandboxed skeleton::s0_codex_workspace_write \
             the_network_is_what_ci_says" 2>&1 | tee "$RUNNER_TEMP/s0-outside.log"
          grep -qx 'running 3 tests' "$RUNNER_TEMP/s0-outside.log"
          grep -q '^test result: ok. 3 passed; 0 failed' "$RUNNER_TEMP/s0-outside.log"
      # macOS has no network namespaces: the tests run as the runner's user
      # with one group of their own (ecnonet, gid 4242, made here), and a pf
      # rule in an anchor of the default ruleset refuses every TCP and UDP
      # packet a socket of that group sends anywhere but lo0 (a refusal at
      # once, ECONNREFUSED). The runner's own traffic, in its own groups,
      # is untouched. Name lookups through getaddrinfo go through the
      # system's resolver, which sends the queries itself, outside the
      # group: an access control entry denies the group the resolver's
      # socket, so such a lookup from the tests fails and no query leaves
      # for it (Codex review, medium: a value in a name could reach external
      # DNS unrecorded). The resolver's XPC service, which Network.framework
      # and URLSession use, is not refused; agent_hosts.rs fails a host
      # whose files import it, which a framework loaded at run time passes
      # unseen (docs/ACCEPTANCE.md).
      - name: Loopback only for the tests' group (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo dscl . -create /Groups/ecnonet
          sudo dscl . -create /Groups/ecnonet PrimaryGroupID 4242
          printf '%s\n' 'pass quick on lo0 all flags any no state' \
            'block return out quick proto { tcp udp } all group 4242' \
            | sudo pfctl -a com.apple/ecnonet -f -
          sudo pfctl -E
          sudo pfctl -a com.apple/ecnonet -s rules
          # Name lookups through getaddrinfo too: the system's resolver takes
          # them on its socket and sends the queries itself, outside the
          # group; an access control entry denies the group that socket, so
          # such a lookup fails before any query is made for it. Lookups
          # over the resolver's XPC service (Network.framework, URLSession)
          # are not refused: agent_hosts.rs checks that no pinned host
          # imports one, by static imports only (a framework loaded at run
          # time is not seen; docs/ACCEPTANCE.md).
          sudo chmod +a "group:ecnonet deny write,append" /var/run/mDNSResponder
          /bin/ls -le /var/run/mDNSResponder
      - name: Agent hosts, loopback only (macOS)
        if: runner.os == 'macOS'
        env:
          ENVCLOAK_TEST_NETWORK: loopback-only
        run: |
          sudo -E env -u SUDO_COMMAND -u SUDO_USER -u SUDO_UID -u SUDO_GID \
            "PATH=$PATH" "HOME=$HOME" "USER=$USER" "LOGNAME=$USER" \
            "$(command -v python3)" -c 'import os, sys; os.setgroups([4242]); os.setgid(4242); os.setuid(int(sys.argv[1])); os.execvp(sys.argv[2], sys.argv[2:])' \
            "$(id -u)" cargo test --locked --offline -p envcloak-e2e $TESTS -- --nocapture --test-threads=1

  # The real-model release check (M2 plan D-13, Q-01): manual and nightly
  # only, with dedicated low-limit keys from Actions secrets, which pull
  # requests from forks never get. From V1 (M2-08's instruction block) it
  # runs the M2 instruction-block prompts against real Claude Code and
  # Codex models, n = 5 per host and system per night, and records use
  # rates in docs/COMPAT.md. Until the repository variable
  # ENVCLOAK_RELEASE_CHECK_MODELS is "on" (set once V1 and the keys
  # exist), the job is skipped, which no run reads as a pass; once on, a
  # missing key or a prompt set that is not there yet fails it.
  release-check-models:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.ENVCLOAK_RELEASE_CHECK_MODELS == 'on'
    name: release-check-models (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: What runs
        env:
          ANTHROPIC_KEY_SET: ${{ secrets.ENVCLOAK_RELEASE_CHECK_ANTHROPIC_KEY != '' }}
          OPENAI_KEY_SET: ${{ secrets.ENVCLOAK_RELEASE_CHECK_OPENAI_KEY != '' }}
        run: |
          if [ "$ANTHROPIC_KEY_SET" != "true" ] || [ "$OPENAI_KEY_SET" != "true" ]; then
            msg="ENVCLOAK_RELEASE_CHECK_ANTHROPIC_KEY and ENVCLOAK_RELEASE_CHECK_OPENAI_KEY are not both configured"
          else
            msg="the M2 instruction-block prompts land with M2-08 (V1); there is nothing to measure before them"
          fi
          echo "::error title=release-check-models::$msg"
          echo "release-check-models failed: $msg" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # The macOS app (M3 plan §5 rule 8, task M3-02; docs/APP.md "CI: the
  # macos-app job"). On pull requests only when ci-paths.py's `app` answer
  # says the change reaches the app; on main, nightly and manual runs
  # always. Xcode 26.6 is selected by path and the job fails when the runner
  # lacks it (plan K3-07). The Swift rules and every script test suite
  # (scripts/macos/tests/, each whole) run before anything is built; then
  # the packages' tests, the app built and signed ad hoc (sign-check
  # inside), the built app read by two signature readers and the kernel, an
  # install into a temporary directory, the hosted tests, and the
  # compiled-sources check over every build. The UI tests run on main,
  # nightly and manual runs only, until they are shown stable on pull
  # requests.
  macos-app:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26.6, selected by path
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error title=macos-app::/Applications/Xcode_26.6.app is not on this runner"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          xcodebuild -version
          xcodebuild -version | grep -qx "Build version 17F113" || {
            echo "::error title=macos-app::the selected Xcode is not 26.6 (17F113)"
            exit 1
          }
          sw_vers
          python3 --version
          automationmodetool || true
      # Every scripts/macos/tests/test_*.py runs here whole (every class;
      # those that need a built app or build report their skips, and run
      # again below with it): test_ci_job.py checks this job for each.
      - name: The job runs every script test
        run: python3 scripts/macos/tests/test_ci_job.py
      - name: Swift rules and their fixtures
        run: |
          scripts/macos/check-swift.sh
          python3 scripts/macos/tests/test_check_swift.py
      - name: The Swift rules' literal values against the language reference (independent oracle)
        run: python3 scripts/macos/tests/test_swift_literal_values.py
      - name: Workspace wire and test environment contracts
        run: python3 scripts/macos/tests/test_workspace_contracts.py
      - name: The project's resolved settings
        run: python3 scripts/macos/tests/test_project_settings.py
      - name: sign-check's fixtures (gate 19 for the bundle)
        run: python3 scripts/macos/tests/test_sign_check.py
      - name: sign-check's policy on modeled codesign and lipo answers
        run: python3 scripts/macos/tests/test_sign_check_policy.py
      - name: build-app.sh keeps the previous app and leaves nothing behind, however it stops
        run: python3 scripts/macos/tests/test_build_swap.py
      - name: check-sources.sh --swift's fixtures
        run: python3 scripts/macos/tests/test_check_sources_swift.py
      - name: Independent models of the tests' process cleanup and of the compiled-record check
        run: python3 scripts/macos/tests/test_owned_cleanup_and_records.py
      - name: EnvCloakKit and EnvCloakDesign tests
        run: |
          # Kit has two library products; Xcode puts its tests in the package scheme.
          (cd apps/macos/Packages/EnvCloakKit && xcodebuild -scheme EnvCloakKit-Package -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-EnvCloakKit" SWIFT_TREAT_WARNINGS_AS_ERRORS=YES test)
          (cd apps/macos/Packages/EnvCloakDesign && xcodebuild -scheme EnvCloakDesign -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-EnvCloakDesign" SWIFT_TREAT_WARNINGS_AS_ERRORS=YES test)
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-app
      - name: Swift client wire, peer, oracle and real-daemon tests
        run: |
          kit_root="$(mktemp -d /tmp/eck.XXXXXXXX)"
          trap 'rm -rf "$kit_root"' EXIT
          mkdir -m 700 "$kit_root"/{home,tmp,config,data,state,runtime,cache,vectors}
          env -i HOME="$kit_root/home" TMPDIR="$kit_root/tmp" \
            XDG_CONFIG_HOME="$kit_root/config" XDG_DATA_HOME="$kit_root/data" \
            XDG_STATE_HOME="$kit_root/state" XDG_RUNTIME_DIR="$kit_root/runtime" \
            XDG_CACHE_HOME="$kit_root/cache" ENVCLOAK_SWIFT_VECTORS="$kit_root/vectors" \
            PATH="$PATH" LANG=en_US.UTF-8 DEVELOPER_DIR="$DEVELOPER_DIR" \
            CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/kit-target" CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=3 \
            scripts/macos/test-kit.sh
      - name: Build, sign, check and install the app (ad hoc)
        run: |
          scripts/macos/build-app.sh --sign adhoc --out "$RUNNER_TEMP/app" --derived-data "$RUNNER_TEMP/dd-release" \
            --install --install-dir "$RUNNER_TEMP/Applications" | tee "$RUNNER_TEMP/build-app.out"
          test "$(tail -1 "$RUNNER_TEMP/build-app.out")" = "$RUNNER_TEMP/Applications/EnvCloak.app"
      - name: The built app, through two signature readers and the kernel
        run: |
          python3 scripts/macos/tests/test_sign_check.py --app "$RUNNER_TEMP/app/EnvCloak.app" BuiltApp
          python3 scripts/macos/tests/test_sign_check.py --app "$RUNNER_TEMP/Applications/EnvCloak.app" BuiltApp
      # The app ships exactly three executables (gate 19), so not the
      # probe's programs: `agents status --probe` from its CLI finds the
      # daemon in the helper and says, before anything is made, what it
      # lacks (M2 plan M2-28; docs/INSTALLERS.md).
      - name: agents status --probe from the app names what it lacks
        run: |
          cli="$RUNNER_TEMP/Applications/EnvCloak.app/Contents/MacOS/envcloak"
          code=0
          "$cli" agents status --probe --json >"$RUNNER_TEMP/probe.out" 2>"$RUNNER_TEMP/probe.err" || code=$?
          cat "$RUNNER_TEMP/probe.out" "$RUNNER_TEMP/probe.err"
          test "$code" = 1
          grep -q probe_unavailable "$RUNNER_TEMP/probe.out" "$RUNNER_TEMP/probe.err"
          grep -q 'envcloak-probe-model and envcloak-probe-mcp' "$RUNNER_TEMP/probe.out" "$RUNNER_TEMP/probe.err"
      - name: The app's hosted tests
        run: |
          TEST_RUNNER_ENVCLOAK_TEST_CLI="$RUNNER_TEMP/Applications/EnvCloak.app/Contents/MacOS/envcloak" \
          xcodebuild -project apps/macos/EnvCloak.xcodeproj -scheme EnvCloak -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-debug" "SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG ENVCLOAK_SCREEN_TESTS" SWIFT_SUPPRESS_WARNINGS=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES test
      - name: The app's UI tests (main, nightly and manual)
        if: github.event_name != 'pull_request'
        run: python3 scripts/macos/tests/run_workspace.py
      - name: Compiled Swift sources are the scanned sources
        run: |
          for dd in "$RUNNER_TEMP"/dd-*; do
            scripts/check-sources.sh --swift "$dd"
          done
          # The app's own builds, and each again with a test file added to
          # the app's compile list, which must fail.
          for dd in "$RUNNER_TEMP/dd-release" "$RUNNER_TEMP/dd-debug"; do
            python3 scripts/macos/tests/test_check_sources_swift.py --derived-data "$dd" RealBuild
          done
