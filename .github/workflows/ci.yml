name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The gate 19 crash test runs its positive core-dump control only when
      # core files go to a known directory, which it checks and cleans up.
      # In CI it fails if the control cannot run.
      - name: Route core dumps to a known directory (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/eccores
          sudo sysctl -w kernel.core_pattern=/tmp/eccores/core.%p
          echo "ENVCLOAK_TEST_CORE_DIR=/tmp/eccores" >> "$GITHUB_ENV"
      - name: Route core dumps to a known directory (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo mkdir -p /cores
          sudo chmod 1777 /cores
          sudo sysctl -w kern.coredump=1
          sudo sysctl -w kern.corefile=/cores/core.%P
          echo "ENVCLOAK_TEST_CORE_DIR=/cores" >> "$GITHUB_ENV"
      # Gates 20 and 21 need a second user to own a directory, connect
      # from another uid and squat on a socket (T7). sudo is passwordless on
      # the runners.
      - name: Create a second user (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo useradd --no-create-home --shell /usr/sbin/nologin ecother
          sudo -n -u ecother true
          echo "ENVCLOAK_TEST_OTHER_USER=ecother" >> "$GITHUB_ENV"
      # `envcloak daemon install` is tested under the real service manager:
      # a systemd user manager (lingering keeps it up without a login) on
      # Linux, launchd on macOS.
      - name: Start a systemd user manager (Linux)
        if: runner.os == 'Linux'
        run: |
          uid="$(id -u)"
          sudo loginctl enable-linger "$USER"
          for _ in $(seq 1 100); do
            [ -S "/run/user/$uid/bus" ] && break
            sleep 0.1
          done
          XDG_RUNTIME_DIR="/run/user/$uid" systemctl --user show-environment >/dev/null
          echo "ENVCLOAK_TEST_SERVICE_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "ENVCLOAK_TEST_SERVICE_MANAGER=1" >> "$GITHUB_ENV"
      # Gate 27's real-process test runs in a user and pid namespace, where
      # it can hand a pid out again. Ubuntu's AppArmor strips capabilities
      # from unprivileged user namespaces unless this is off.
      - name: Allow unprivileged user namespaces (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --pid --fork --mount-proc sh -c 'echo 1 >/proc/sys/kernel/ns_last_pid'
      - name: Allow the launchd test (macOS)
        if: runner.os == 'macOS'
        run: echo "ENVCLOAK_TEST_SERVICE_MANAGER=1" >> "$GITHUB_ENV"
      # Gate 8 feeds the output of real serializers through the runner
      # (crates/envcloak-exec/tests/runner.rs) and, in the fixture story,
      # through the whole of `envcloak run` (crates/envcloak-e2e): Python,
      # Node, Go, .NET and PHP are set up on both systems and required, so
      # a missing one fails the gate instead of narrowing it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: none
      - name: Serializers gate 8 requires
        run: |
          python3 --version
          node --version
          go version
          dotnet --version
          php --version
          echo "ENVCLOAK_TEST_REQUIRE_SERIALIZERS=node,go,php" >> "$GITHUB_ENV"
          echo "ENVCLOAK_TEST_REQUIRE_EMITTERS=python,node,go,dotnet,php,serde" >> "$GITHUB_ENV"
          echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - name: Unsafe-code and secret-exposure boundaries
        run: |
          python3 --version
          scripts/check-unsafe.sh
      - run: cargo clippy --workspace --all-targets --locked
      # The shipped binaries' own configuration: release profile, no
      # test-only features. Code compiled only there is linted too.
      - run: cargo clippy --release --locked
      - name: Compiled sources are the scanned sources
        run: scripts/check-sources.sh
      - name: expose_secret lint canary
        run: scripts/check-expose-lint.sh
      - name: unsafe_code forbid canary
        run: scripts/check-unsafe-lint.sh
      # Gate 12: the whole suite at RUST_LOG=trace with full backtraces;
      # TestHome passes both on to every process the tests start. Nothing
      # reads RUST_LOG yet (no logger); it is set so logging added later is
      # swept at its most verbose. The gate rests on each test's sweep of
      # what it captured, and crates/envcloak-e2e's injected panics,
      # malformed inputs holding fixtures, and the fixture story.
      - name: cargo test --workspace (RUST_LOG=trace)
        env:
          RUST_LOG: trace
          RUST_BACKTRACE: full
        run: cargo test --workspace --locked --no-fail-fast

  # The shipped binaries as `cargo build --release` makes them: panic =
  # "abort" and no core file (gate 19), no test hook, a truthful `status`,
  # and the fixture story and gate 12 run on them
  # (crates/envcloak-e2e/tests/release.rs).
  release:
    name: release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Route core dumps to a known directory (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/eccores
          sudo sysctl -w kernel.core_pattern=/tmp/eccores/core.%p
          echo "ENVCLOAK_TEST_CORE_DIR=/tmp/eccores" >> "$GITHUB_ENV"
      - name: Route core dumps to a known directory (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo mkdir -p /cores
          sudo chmod 1777 /cores
          sudo sysctl -w kern.coredump=1
          sudo sysctl -w kern.corefile=/cores/core.%P
          echo "ENVCLOAK_TEST_CORE_DIR=/cores" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: none
      - name: Build the release binaries and the test build's controls
        run: |
          cargo build --release --locked
          cargo build --locked -p envcloak -p envcloakd -p envcloak-testkit --bins
      - name: Release checks, gate 12 and the fixture story on the release binaries
        env:
          RUST_LOG: trace
          RUST_BACKTRACE: full
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          ENVCLOAK_TEST_REQUIRE_EMITTERS: python,node,go,dotnet,php,serde
          ENVCLOAK_TEST_REQUIRE_RELEASE: "1"
        run: |
          export ENVCLOAK_TEST_RELEASE_DIR="$PWD/target/release"
          export ENVCLOAK_E2E_BIN_DIR="$PWD/target/release"
          cargo test --locked -p envcloak-e2e --no-fail-fast

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
