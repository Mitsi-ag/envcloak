# Anthropic. Format and loader rules: docs/PROVIDERS.md.
id = "anthropic"
name = "Anthropic"

# API keys (`sk-ant-api03-`), Admin API keys (`sk-ant-admin01-`) and OAuth
# tokens: `sk-ant-`, a kind and a two-digit version, then the key.
key_patterns = ['^sk-ant-[a-z]{2,10}[0-9]{2}-[A-Za-z0-9_-]{20,}$']
# Anthropic has no test mode: every key acts on the real account.
live_patterns = ['^sk-ant-']
env_hints = ["ANTHROPIC_API_KEY", "ANTHROPIC_ADMIN_KEY", "CLAUDE_API_KEY"]

allowed_hosts = ["api.anthropic.com"]
auth = [{ header = "x-api-key" }]
# The Admin API: API keys, workspaces, members and invites.
denied_paths = ["/v1/organizations"]

[links]
docs = "https://docs.anthropic.com/en/api/overview"
billing = "https://console.anthropic.com/settings/billing"
keys = "https://console.anthropic.com/settings/keys"
dashboard = "https://console.anthropic.com/usage"
