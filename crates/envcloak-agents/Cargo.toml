[package]
name = "envcloak-agents"
description = "EnvCloak's agent integrations: the scripted model that coverage probes drive the agent hosts with (envcloak-probe-model)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Test hooks of the scripted model (`probe::model::admit_as`, `serve_bytes`):
# only this crate's own tests enable it, as a dev-dependency, so no build of
# `envcloak-probe-model` has them (tests/release_features.rs).
testing = []

[dependencies]
base64.workspace = true
envcloak-sys.workspace = true
getrandom.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
subtle.workspace = true
zeroize.workspace = true

# The scripted model of M2 plan task M2-04: a loopback HTTP/1.1 server that
# coverage probes and the agent-host tests point Claude Code and Codex at.
# Its own binary, never linked into `envcloak` or `envcloakd`.
[[bin]]
name = "envcloak-probe-model"
path = "src/bin/envcloak-probe-model.rs"

[dev-dependencies]
# Enables the `testing` feature for this crate's own tests.
envcloak-agents = { path = ".", features = ["testing"] }
proptest.workspace = true
