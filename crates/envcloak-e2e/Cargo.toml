[package]
name = "envcloak-e2e"
description = "The M1 fixture acceptance story (SPEC §15.1), gate 12, and the M2 agent-host harness and story steps, end to end through the built envcloak and envcloakd"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# The harness: a test home, the daemon started by absolute path, the
# person's terminal, the agent's shell, the emitters and the sweep. Test
# support only; never a dependency of a shipped crate.
[dependencies]
envcloak-testkit.workspace = true
libc.workspace = true
serde_json.workspace = true
# The emitters print SHA-256 digests of the values they were given, which
# the story compares with the fixtures' (ec-emit-serde prints one too).
sha2.workspace = true
tempfile.workspace = true

# The agent-host tests (M2 plan task M2-04) check the scripted model's
# qualified-version table against agents/versions.toml.
[dev-dependencies]
envcloak-scan.workspace = true
envcloak-agents.workspace = true
# The catalog's tests (M2 plan task M2-10) gather a caller's evidence as
# the daemon does, against the pinned hosts.
envcloak-policy.workspace = true
envcloak-sys.workspace = true
# The coverage probes' tests (M2 plan task M2-09) read the published
# compatibility matrix (integrations/compat/matrix.toml) and hand the
# probe the output fixture's values in wiping buffers.
toml_edit.workspace = true
zeroize.workspace = true
