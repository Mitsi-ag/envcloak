# The agent hosts the M2 tests drive, pinned (M2 plan task M2-04).
#
# scripts/install-agent-hosts.py installs each one into a cache outside
# every HOME and keeps it only when the SHA-256 of its entry file equals
# the value here; envcloak-testkit's agent harness checks it again before
# every run, and after the run checks `--version` and the hash once more,
# so a host that updated itself fails the test. Bumping a version is a
# change to this file and to the qualified table in
# crates/envcloak-agents/src/probe/model.rs (a test keeps the two equal),
# with the stub re-qualified against the new version.
#
# Platforms: darwin-arm64 (macos-latest, a developer's Mac) and linux-x64
# (ubuntu-latest).
#
# Tier 1 (decision D-14) are driven end to end. Tier 2 are installed here
# so M2-10 can observe their real install layouts; M2-04 ran each against
# the scripted model (agent_hosts' tier-2 tests): which protocol it speaks,
# and for the drivable ones the shell command it starts and that
# command's ancestry, recorded in docs/ACCEPTANCE.md. An npm host's entry
# is a script its `interpreter` runs; one whose entry starts another
# program names it in `starts`, hashed too.
#
# npm-installed hosts are installed with `npm ci` from the lockfile in
# npm/<id>/, which pins every package in the tree by its integrity hash.

# Claude Code, the native build (the documented install).
[[host]]
id = "claude-code"
variant = "native"
tier = 1
version = "2.1.280"
method = "download"
url = "https://downloads.claude.ai/claude-code-releases/{version}/{platform}/claude"
entry = "claude"

[host.sha256]
darwin-arm64 = "387a5c5dcdbb815085edf0baf79591f9d8894efe922bceaf3d75b1b08055229d"
linux-x64 = "1e08503dbdf3c2cb0d706d32f3408277388d1c76ef108673e8fe42c1b322925b"

# Claude Code from npm, as `npm install -g` leaves it: its install script
# copies the same native binary over bin/claude.exe (the hashes equal the
# native build's), so this variant differs from the native one only in
# where the binary lives (node_modules/.../bin/claude.exe), which M2-10's
# path catalog reads.
[[host]]
id = "claude-code"
variant = "npm"
tier = 1
version = "2.1.280"
method = "npm"
package = "@anthropic-ai/claude-code"
scripts = true
entry = "node_modules/@anthropic-ai/claude-code/bin/claude.exe"

[host.sha256]
darwin-arm64 = "387a5c5dcdbb815085edf0baf79591f9d8894efe922bceaf3d75b1b08055229d"
linux-x64 = "1e08503dbdf3c2cb0d706d32f3408277388d1c76ef108673e8fe42c1b322925b"

# Claude Code from npm with install scripts off (`npm install
# --ignore-scripts`): bin/claude.exe stays a placeholder and the package's
# fallback launcher, `node cli-wrapper.cjs`, starts the native binary from
# the platform package. The interpreter-launched layout (F-37: Node as the
# entry executable, cli-wrapper.cjs as the script, the native binary its
# child), which M2-10 classifies on an asserted basis.
[[host]]
id = "claude-code"
variant = "npm-wrapper"
tier = 1
version = "2.1.280"
method = "npm"
package = "@anthropic-ai/claude-code"
scripts = false
interpreter = "node"
entry = "node_modules/@anthropic-ai/claude-code/cli-wrapper.cjs"
sha256 = "61ad63033d9c8155d5e60a29f45dc4665afa07631c0b108e62cc83bf45ba490e"

[host.starts]
darwin-arm64 = "node_modules/@anthropic-ai/claude-code-darwin-arm64/claude"
linux-x64 = "node_modules/@anthropic-ai/claude-code-linux-x64/claude"

[host.starts_sha256]
darwin-arm64 = "387a5c5dcdbb815085edf0baf79591f9d8894efe922bceaf3d75b1b08055229d"
linux-x64 = "1e08503dbdf3c2cb0d706d32f3408277388d1c76ef108673e8fe42c1b322925b"

