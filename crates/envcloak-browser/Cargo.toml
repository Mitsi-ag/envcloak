[package]
name = "envcloak-browser"
description = "EnvCloak's dev sign-in driver (SPEC §6.8, M2b): DevTools over a pipe, the origin guard, the login state machine, the identity check, state extraction and the test-session adapter client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
testing = ["envcloak-sys/testing"]

[lints]
workspace = true

[dependencies]
base64.workspace = true
envcloak-signin.workspace = true
envcloak-sys.workspace = true
form_urlencoded.workspace = true
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
envcloak-sys = { workspace = true, features = ["testing"] }
envcloak-testkit.workspace = true
proptest.workspace = true
tempfile.workspace = true
