[package]
name = "envcloak-mcp"
description = "EnvCloak's MCP server (`envcloak mcp`): metadata tools and run_with_secrets over stdio JSON-RPC, never a value"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# Normal dependencies stay within the edges scripts/check-crate-graph.py
# allows for this crate (D-02). The server holds no value, so it needs no
# expose_secret entry: run_with_secrets runs a child `envcloak run`, which
# alone receives the values (D-03).
[dependencies]
# Each host's MCP tool cutoff, which bounds how long a tool waits for a
# person (tool_timeouts).
envcloak-agents.workspace = true
# The verified daemon connection, failures and their tokens, the provider
# registry's key masking, and the manifest editor of `envcloak ref`.
envcloak-client.workspace = true
envcloak-ipc.workspace = true
envcloak-policy.workspace = true
# Owned children: a call's child is signalled, as a group, only while it
# is unreaped; this server's own identity and ancestry, read as the daemon
# reads a caller's, to show the grants that cover its calls.
envcloak-sys.workspace = true
# Where the agent catalog the daemon loads lives (VaultPaths), for that
# same evidence.
envcloak-core.workspace = true
libc.workspace = true
serde_json.workspace = true

[dev-dependencies]
envcloak-testkit.workspace = true
tempfile.workspace = true
