[package]
name = "envcloakd"
description = "The EnvCloak vault broker daemon: the only process that holds the unlocked vault key"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
envcloak-core.workspace = true
envcloak-ipc.workspace = true
envcloak-policy.workspace = true
envcloak-providers.workspace = true
envcloak-redact.workspace = true
envcloak-sys.workspace = true
libc.workspace = true
secrecy.workspace = true

[dev-dependencies]
base64.workspace = true
envcloak-ipc = { workspace = true, features = ["testing"] }
envcloak-sys = { workspace = true, features = ["testing"] }
envcloak-testkit.workspace = true
# The grant tests tamper with a vault file directly, as the core's do.
rusqlite.workspace = true
serde_json.workspace = true
# Gate 28 checks the audited manifest hash against the file's bytes.
sha2.workspace = true
tempfile.workspace = true
