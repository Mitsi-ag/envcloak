[package]
name = "envcloak"
description = "The EnvCloak command-line client, for people and AI coding agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Each host's MCP tool cutoff, which sets `envcloak mcp --host`'s wait.
envcloak-agents.workspace = true
# The connection, failures, rendering, prompts and the manifest editor,
# shared with envcloak-mcp and envcloak-agents (D-02).
envcloak-client.workspace = true
envcloak-core.workspace = true
envcloak-exec.workspace = true
envcloak-ipc.workspace = true
# `envcloak mcp`: the MCP server (M2-06).
envcloak-mcp.workspace = true
envcloak-policy.workspace = true
envcloak-scan.workspace = true
envcloak-sys.workspace = true
libc.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[dev-dependencies]
envcloak-ipc = { workspace = true, features = ["testing"] }
# The fixture vault's items are classified with the provider registry.
envcloak-providers.workspace = true
# Gate 16's test kills `envcloak init` at each of its pause points.
envcloak-scan = { workspace = true, features = ["testing"] }
envcloak-sys = { workspace = true, features = ["testing"] }
envcloak-testkit.workspace = true
# The output snapshots replace times, ids and paths before comparing.
regex.workspace = true
# The run tests compare the digests the command prints of its values.
sha2.workspace = true
tempfile.workspace = true
