[package]
name = "envcloak"
description = "The EnvCloak command-line client, for people and AI coding agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
envcloak-core.workspace = true
envcloak-exec.workspace = true
envcloak-ipc.workspace = true
envcloak-policy.workspace = true
envcloak-providers.workspace = true
envcloak-scan.workspace = true
envcloak-sys.workspace = true
libc.workspace = true
serde_json.workspace = true
# `envcloak ref` edits envcloak.toml in place: comments, order and layout
# are kept, so it needs the writer as well as the parser.
toml_edit = { workspace = true, features = ["display"] }
zeroize.workspace = true

[dev-dependencies]
envcloak-ipc = { workspace = true, features = ["testing"] }
envcloak-sys = { workspace = true, features = ["testing"] }
envcloak-testkit.workspace = true
# The output snapshots replace times, ids and paths before comparing.
regex.workspace = true
# The run tests compare the digests the command prints of its values.
sha2.workspace = true
tempfile.workspace = true
