[package]
name = "envcloak-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Test support only: exporting and importing a VMK, opening or restoring a
# vault with a migration plan other than the shipped one, wrapping a new
# passphrase at other Argon2id parameters, and observing a restore step by
# step. Release binaries never enable it.
testing = []

[dependencies]
argon2.workspace = true
blake2.workspace = true
blake3.workspace = true
chacha20poly1305.workspace = true
envcloak-sys.workspace = true
getrandom.workspace = true
hkdf.workspace = true
libc.workspace = true
rusqlite.workspace = true
secrecy.workspace = true
sha2.workspace = true
subtle.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Enables the `testing` feature for this crate's own tests.
envcloak-core = { path = ".", features = ["testing"] }
envcloak-testkit.workspace = true
rusqlite.workspace = true
serde.workspace = true
static_assertions.workspace = true
tempfile.workspace = true
