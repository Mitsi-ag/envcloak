[package]
name = "envcloak-testkit"
description = "Test support for EnvCloak: runtime-generated canaries, their encodings, canary sweeps and the allocator probe"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
aho-corasick.workspace = true
# The agent harness (src/agents.rs): the scripted model's reports carry
# request bodies as base64 JSON, and pinned hosts are checked by SHA-256.
base64.workspace = true
libc.workspace = true
envcloak-sys = { workspace = true, features = ["testing"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
# assert_fresh reads the workspace's manifests to find what a binary is
# built from; the agent harness edits Codex's config.toml key by key, keeping
# what Codex's own CLI wrote there (`display` writes it back; envcloak-client
# enables it already).
toml_edit = { workspace = true, features = ["display"] }
zeroize.workspace = true

[dev-dependencies]
form_urlencoded.workspace = true
