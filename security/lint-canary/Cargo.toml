[package]
name = "envcloak-lint-canary"
description = "A deliberate expose_secret violation that proves clippy's disallowed-methods lint is active for workspace crates"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# A workspace member, so it builds under the workspace lint levels and the
# root clippy.toml like every crate. Its code compiles only with
# `--cfg envcloak_lint_canary`, which scripts/check-expose-lint.sh passes;
# ordinary builds see an empty crate.
[lints]
workspace = true

[dependencies]
secrecy.workspace = true
