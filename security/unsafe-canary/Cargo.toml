[package]
name = "envcloak-unsafe-canary"
description = "Deliberate unsafe code and allows of it, proving the compiler forbids both in workspace crates"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# A workspace member, so it builds under the workspace lint levels like every
# crate but envcloak-sys. Its code compiles only with
# `--cfg envcloak_unsafe_canary`, which scripts/check-unsafe-lint.sh passes
# after writing the module it compiles; ordinary builds see an empty crate.
[lints]
workspace = true
