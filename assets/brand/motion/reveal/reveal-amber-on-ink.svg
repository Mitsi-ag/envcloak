<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 176" class="ec-m ec-reveal" role="img" aria-label="EnvCloak"><title>EnvCloak</title><desc>EnvCloak logo reveal. The = draws in (0 to 720 ms), the block lands at 900 ms, blinks twice on the 530 ms caret clock and rests at 3020 ms. Reduced motion shows the resting logo.</desc><style>.ec-reveal .ec-wipe{transform-box:fill-box;transform-origin:0 50%}.ec-reveal .ec-w1{animation:ec-reveal-w1-t 5020ms linear var(--ec-iter,1) both}.ec-reveal .ec-w2{animation:ec-reveal-w2-t 5020ms linear var(--ec-iter,1) both}.ec-reveal .ec-block{animation:ec-reveal-block-o 5020ms linear var(--ec-iter,1) both}@keyframes ec-reveal-w1-t{0%{transform:scaleX(0);animation-timing-function:cubic-bezier(0.5,0,0,1)}10.757%{transform:scaleX(1);animation-timing-function:linear}100%{transform:scaleX(1)}}@keyframes ec-reveal-w2-t{0%{transform:scaleX(0);animation-timing-function:linear}3.5857%{transform:scaleX(0);animation-timing-function:cubic-bezier(0.5,0,0,1)}14.3426%{transform:scaleX(1);animation-timing-function:linear}100%{transform:scaleX(1)}}@keyframes ec-reveal-block-o{0%{opacity:0;animation-timing-function:steps(1,end)}17.9283%{opacity:1;animation-timing-function:steps(1,end)}28.4861%{opacity:0;animation-timing-function:steps(1,end)}39.0438%{opacity:1;animation-timing-function:steps(1,end)}49.6016%{opacity:0;animation-timing-function:steps(1,end)}60.1594%{opacity:1;animation-timing-function:steps(1,end)}100%{opacity:1}}@media (prefers-reduced-motion:reduce){.ec-reveal *{animation:none!important;transition:none!important}}.ec-reduced .ec-reveal *{animation:none!important;transition:none!important}</style><rect width="208" height="176" fill="#111110"/><defs><clipPath id="ec-reveal-amber-on-ink-b1"><path d="M52 64H92A4 4 0 0 1 96 68V76A4 4 0 0 1 92 80H52A4 4 0 0 1 48 76V68A4 4 0 0 1 52 64Z"/></clipPath><clipPath id="ec-reveal-amber-on-ink-b2"><path d="M52 96H92A4 4 0 0 1 96 100V108A4 4 0 0 1 92 112H52A4 4 0 0 1 48 108V100A4 4 0 0 1 52 96Z"/></clipPath></defs><g class="ec-equals" fill="#F3F0E8"><g clip-path="url(#ec-reveal-amber-on-ink-b1)"><rect class="ec-wipe ec-w1" x="48" y="64" width="48" height="16"/></g><g clip-path="url(#ec-reveal-amber-on-ink-b2)"><rect class="ec-wipe ec-w2" x="48" y="96" width="48" height="16"/></g></g><path class="ec-block" d="M116 48H156A4 4 0 0 1 160 52V124A4 4 0 0 1 156 128H116A4 4 0 0 1 112 124V52A4 4 0 0 1 116 48Z" fill="#FFB000"/></svg>
