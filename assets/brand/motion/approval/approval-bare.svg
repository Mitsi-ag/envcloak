<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 128 96" class="ec-m ec-approval" role="img" aria-label="Waiting for approval"><title>Waiting for approval</title><desc>EnvCloak approval moment. A request arrives at 600 ms: the block turns Amber in 120 ms and pulses once to 1.1x, then waits, still, for Touch ID. Approved at 3000 ms, it returns to Paper in 240 ms. Amber only ever sits on Ink: use this bare file only on Ink #111110 or the dark tile #0B0B0A. Reduced motion keeps the colour turn and drops the pulse.</desc><style>.ec-approval .ec-block{transform-box:fill-box;transform-origin:50% 50%}.ec-approval .ec-block{animation:ec-approval-block-f 4800ms linear var(--ec-iter,1) both,ec-approval-block-t 4800ms linear var(--ec-iter,1) both}@keyframes ec-approval-block-f{0%{fill:#F3F0E8;animation-timing-function:linear}12.5%{fill:#F3F0E8;animation-timing-function:linear}15%{fill:#FFB000;animation-timing-function:linear}62.5%{fill:#FFB000;animation-timing-function:cubic-bezier(0.2,0,0,1)}67.5%{fill:#F3F0E8;animation-timing-function:linear}100%{fill:#F3F0E8}}@keyframes ec-approval-block-t{0%{transform:scale(1);animation-timing-function:linear}12.5%{transform:scale(1);animation-timing-function:cubic-bezier(0.2,0,0,1)}16.25%{transform:scale(1.1);animation-timing-function:cubic-bezier(0.45,0,0.55,1)}25%{transform:scale(1);animation-timing-function:linear}100%{transform:scale(1)}}@media (prefers-reduced-motion:reduce){.ec-approval *{animation:none!important;transition:none!important}.ec-approval .ec-block{animation:ec-approval-block-f 4800ms linear var(--ec-iter,1) both!important}}.ec-reduced .ec-approval *{animation:none!important;transition:none!important}.ec-reduced .ec-approval .ec-block{animation:ec-approval-block-f 4800ms linear var(--ec-iter,1) both!important}</style><path class="ec-equals" d="M4 16H44A4 4 0 0 1 48 20V28A4 4 0 0 1 44 32H4A4 4 0 0 1 0 28V20A4 4 0 0 1 4 16ZM4 48H44A4 4 0 0 1 48 52V60A4 4 0 0 1 44 64H4A4 4 0 0 1 0 60V52A4 4 0 0 1 4 48Z" fill="#F3F0E8"/><path class="ec-block" d="M68 0H108A4 4 0 0 1 112 4V76A4 4 0 0 1 108 80H68A4 4 0 0 1 64 76V4A4 4 0 0 1 68 0Z" fill="#F3F0E8"/></svg>
