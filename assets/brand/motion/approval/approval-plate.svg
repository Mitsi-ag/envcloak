<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 824 824" class="ec-m ec-approval" role="img" aria-label="Waiting for approval"><title>Waiting for approval</title><desc>EnvCloak approval moment. A request arrives at 600 ms: the block turns Amber in 120 ms and pulses once to 1.1x, then waits, still, for Touch ID. Approved at 3000 ms, it returns to Paper in 240 ms. Amber only ever sits on Ink, so this file carries its own Ink plate. Reduced motion keeps the colour turn and drops the pulse.</desc><style>.ec-approval .ec-block{transform-box:fill-box;transform-origin:50% 50%}.ec-approval .ec-block{animation:ec-approval-block-f 4800ms linear var(--ec-iter,1) both,ec-approval-block-t 4800ms linear var(--ec-iter,1) both}@keyframes ec-approval-block-f{0%{fill:#F3F0E8;animation-timing-function:linear}12.5%{fill:#F3F0E8;animation-timing-function:linear}15%{fill:#FFB000;animation-timing-function:linear}62.5%{fill:#FFB000;animation-timing-function:cubic-bezier(0.2,0,0,1)}67.5%{fill:#F3F0E8;animation-timing-function:linear}100%{fill:#F3F0E8}}@keyframes ec-approval-block-t{0%{transform:scale(1);animation-timing-function:linear}12.5%{transform:scale(1);animation-timing-function:cubic-bezier(0.2,0,0,1)}16.25%{transform:scale(1.1);animation-timing-function:cubic-bezier(0.45,0,0.55,1)}25%{transform:scale(1);animation-timing-function:linear}100%{transform:scale(1)}}@media (prefers-reduced-motion:reduce){.ec-approval *{animation:none!important;transition:none!important}.ec-approval .ec-block{animation:ec-approval-block-f 4800ms linear var(--ec-iter,1) both!important}}.ec-reduced .ec-approval *{animation:none!important;transition:none!important}.ec-reduced .ec-approval .ec-block{animation:ec-approval-block-f 4800ms linear var(--ec-iter,1) both!important}</style><path class="ec-plate" d="M627.36 100c103.83 0 155.75 0 195.41 20.21a185.4 185.4 0 0 1 81.02 81.02c20.21 39.66 20.21 91.58 20.21 195.41L924 627.36c0 103.83 0 155.75 -20.21 195.41a185.4 185.4 0 0 1 -81.02 81.02c-39.66 20.21 -91.58 20.21 -195.41 20.21L396.64 924c-103.83 0 -155.75 0 -195.41 -20.21a185.4 185.4 0 0 1 -81.02 -81.02c-20.21 -39.66 -20.21 -91.58 -20.21 -195.41L100 396.64c0 -103.83 0 -155.75 20.21 -195.41a185.4 185.4 0 0 1 81.02 -81.02c39.66 -20.21 91.58 -20.21 195.41 -20.21Z" fill="#111110"/><path class="ec-equals" d="M264.2 405.8H441.2A17.7 17.7 0 0 1 458.9 423.5V458.9A17.7 17.7 0 0 1 441.2 476.6H264.2A17.7 17.7 0 0 1 246.5 458.9V423.5A17.7 17.7 0 0 1 264.2 405.8ZM264.2 547.4H441.2A17.7 17.7 0 0 1 458.9 565.1V600.5A17.7 17.7 0 0 1 441.2 618.2H264.2A17.7 17.7 0 0 1 246.5 600.5V565.1A17.7 17.7 0 0 1 264.2 547.4Z" fill="#F3F0E8"/><path class="ec-block" d="M547.4 335H724.4A17.7 17.7 0 0 1 742.1 352.7V671.3A17.7 17.7 0 0 1 724.4 689H547.4A17.7 17.7 0 0 1 529.7 671.3V352.7A17.7 17.7 0 0 1 547.4 335Z" fill="#F3F0E8"/></svg>
