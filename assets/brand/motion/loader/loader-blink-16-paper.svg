<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ec-m ec-loader-blink" role="img" aria-label="Working"><title>Working</title><desc>EnvCloak busy indicator, 16 px. The block blinks like a caret: 530 ms on, 530 ms off. Reduced motion: a slow fade instead of a hard blink.</desc><style>.ec-loader-blink .ec-track{opacity:0.2}.ec-loader-blink .ec-block{animation:ec-loader-blink-block-o 1060ms linear infinite both}@keyframes ec-loader-blink-block-o{0%{opacity:1;animation-timing-function:steps(1,end)}50%{opacity:0;animation-timing-function:steps(1,end)}100%{opacity:0}}@keyframes ec-loader-blink-soft{0%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion:reduce){.ec-loader-blink *{animation:none!important;transition:none!important}.ec-loader-blink .ec-block{animation:ec-loader-blink-soft 1060ms cubic-bezier(0.45,0,0.55,1) infinite alternate!important}}.ec-reduced .ec-loader-blink *{animation:none!important;transition:none!important}.ec-reduced .ec-loader-blink .ec-block{animation:ec-loader-blink-soft 1060ms cubic-bezier(0.45,0,0.55,1) infinite alternate!important}</style><g fill="#F3F0E8" shape-rendering="crispEdges"><path class="ec-equals" d="M1 5H7V7H1ZM1 9H7V11H1Z"/><path class="ec-track" d="M9 3H15V13H9Z"/><path class="ec-block" d="M9 3H15V13H9Z"/></g></svg>
