<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="ec-m ec-loader-blink" role="img" aria-label="Working"><title>Working</title><desc>EnvCloak busy indicator, 48 px. The block blinks like a caret: 530 ms on, 530 ms off. Reduced motion: a slow fade instead of a hard blink.</desc><style>.ec-loader-blink .ec-track{opacity:0.2}.ec-loader-blink .ec-block{animation:ec-loader-blink-block-o 1060ms linear infinite both}@keyframes ec-loader-blink-block-o{0%{opacity:1;animation-timing-function:steps(1,end)}50%{opacity:0;animation-timing-function:steps(1,end)}100%{opacity:0}}@keyframes ec-loader-blink-soft{0%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion:reduce){.ec-loader-blink *{animation:none!important;transition:none!important}.ec-loader-blink .ec-block{animation:ec-loader-blink-soft 1060ms cubic-bezier(0.45,0,0.55,1) infinite alternate!important}}.ec-reduced .ec-loader-blink *{animation:none!important;transition:none!important}.ec-reduced .ec-loader-blink .ec-block{animation:ec-loader-blink-soft 1060ms cubic-bezier(0.45,0,0.55,1) infinite alternate!important}</style><g fill="#F3F0E8"><path class="ec-equals" d="M4.5 15H19.5A1.5 1.5 0 0 1 21 16.5V19.5A1.5 1.5 0 0 1 19.5 21H4.5A1.5 1.5 0 0 1 3 19.5V16.5A1.5 1.5 0 0 1 4.5 15ZM4.5 27H19.5A1.5 1.5 0 0 1 21 28.5V31.5A1.5 1.5 0 0 1 19.5 33H4.5A1.5 1.5 0 0 1 3 31.5V28.5A1.5 1.5 0 0 1 4.5 27Z"/><path class="ec-track" d="M28.5 9H43.5A1.5 1.5 0 0 1 45 10.5V37.5A1.5 1.5 0 0 1 43.5 39H28.5A1.5 1.5 0 0 1 27 37.5V10.5A1.5 1.5 0 0 1 28.5 9Z"/><path class="ec-block" d="M28.5 9H43.5A1.5 1.5 0 0 1 45 10.5V37.5A1.5 1.5 0 0 1 43.5 39H28.5A1.5 1.5 0 0 1 27 37.5V10.5A1.5 1.5 0 0 1 28.5 9Z"/></g></svg>
