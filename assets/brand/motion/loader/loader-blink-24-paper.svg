<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="ec-m ec-loader-blink" role="img" aria-label="Working"><title>Working</title><desc>EnvCloak busy indicator, 24 px. The block blinks like a caret: 530 ms on, 530 ms off. Reduced motion: a slow fade instead of a hard blink.</desc><style>.ec-loader-blink .ec-track{opacity:0.2}.ec-loader-blink .ec-block{animation:ec-loader-blink-block-o 1060ms linear infinite both}@keyframes ec-loader-blink-block-o{0%{opacity:1;animation-timing-function:steps(1,end)}50%{opacity:0;animation-timing-function:steps(1,end)}100%{opacity:0}}@keyframes ec-loader-blink-soft{0%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion:reduce){.ec-loader-blink *{animation:none!important;transition:none!important}.ec-loader-blink .ec-block{animation:ec-loader-blink-soft 1060ms cubic-bezier(0.45,0,0.55,1) infinite alternate!important}}.ec-reduced .ec-loader-blink *{animation:none!important;transition:none!important}.ec-reduced .ec-loader-blink .ec-block{animation:ec-loader-blink-soft 1060ms cubic-bezier(0.45,0,0.55,1) infinite alternate!important}</style><g fill="#F3F0E8"><path class="ec-equals" d="M1.75 7H9.25A0.75 0.75 0 0 1 10 7.75V9.25A0.75 0.75 0 0 1 9.25 10H1.75A0.75 0.75 0 0 1 1 9.25V7.75A0.75 0.75 0 0 1 1.75 7ZM1.75 13H9.25A0.75 0.75 0 0 1 10 13.75V15.25A0.75 0.75 0 0 1 9.25 16H1.75A0.75 0.75 0 0 1 1 15.25V13.75A0.75 0.75 0 0 1 1.75 13Z"/><path class="ec-track" d="M13.75 4H21.25A0.75 0.75 0 0 1 22 4.75V18.25A0.75 0.75 0 0 1 21.25 19H13.75A0.75 0.75 0 0 1 13 18.25V4.75A0.75 0.75 0 0 1 13.75 4Z"/><path class="ec-block" d="M13.75 4H21.25A0.75 0.75 0 0 1 22 4.75V18.25A0.75 0.75 0 0 1 21.25 19H13.75A0.75 0.75 0 0 1 13 18.25V4.75A0.75 0.75 0 0 1 13.75 4Z"/></g></svg>
