<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="ec-m ec-loader-fill-48 ec-loader-fill ec-demo" style="--p:.6" role="img" aria-label="Progress"><title>Progress</title><desc>EnvCloak progress indicator, 48 px. The block fills bottom-up as determinate progress, in whole-pixel steps of 1/30. Set --p (0 to 1) on the svg and remove the ec-demo class to drive it. When complete it blinks twice and rests.</desc><style>.ec-loader-fill-48 .ec-track{opacity:0.2}.ec-loader-fill-48 .ec-level{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(var(--p,0));transition:transform 240ms cubic-bezier(0.2,0,0,1)}.ec-loader-fill-48.ec-demo .ec-level{animation:ec-loader-fill-48-level-t 5600ms linear infinite both,ec-loader-fill-48-level-o 5600ms linear infinite both}@keyframes ec-loader-fill-48-level-t{0%{transform:scaleY(0);animation-timing-function:linear}5.3571%{transform:scaleY(0);animation-timing-function:cubic-bezier(0.2,0,0,1)}9.6429%{transform:scaleY(0.2);animation-timing-function:linear}16.0714%{transform:scaleY(0.2);animation-timing-function:cubic-bezier(0.2,0,0,1)}20.3571%{transform:scaleY(0.3);animation-timing-function:linear}26.7857%{transform:scaleY(0.3);animation-timing-function:cubic-bezier(0.2,0,0,1)}31.0714%{transform:scaleY(0.6);animation-timing-function:linear}37.5%{transform:scaleY(0.6);animation-timing-function:cubic-bezier(0.2,0,0,1)}41.7857%{transform:scaleY(0.9);animation-timing-function:linear}46.4286%{transform:scaleY(0.9);animation-timing-function:cubic-bezier(0.2,0,0,1)}50.7143%{transform:scaleY(1);animation-timing-function:linear}100%{transform:scaleY(1)}}@keyframes ec-loader-fill-48-level-o{0%{opacity:1;animation-timing-function:steps(1,end)}60.1786%{opacity:0;animation-timing-function:steps(1,end)}69.6429%{opacity:1;animation-timing-function:steps(1,end)}79.1071%{opacity:0;animation-timing-function:steps(1,end)}88.5714%{opacity:1;animation-timing-function:steps(1,end)}100%{opacity:1}}@supports (opacity:round(down,.5,1)){.ec-loader-fill-48 .ec-level{transform:scaleY(calc(round(down,var(--p,0) * 30,1) / 30))}}@media (prefers-reduced-motion:reduce){.ec-loader-fill-48 *{animation:none!important;transition:none!important}}.ec-reduced .ec-loader-fill-48 *{animation:none!important;transition:none!important}</style><defs><clipPath id="ec-fill-48-mono"><path d="M28.5 9H43.5A1.5 1.5 0 0 1 45 10.5V37.5A1.5 1.5 0 0 1 43.5 39H28.5A1.5 1.5 0 0 1 27 37.5V10.5A1.5 1.5 0 0 1 28.5 9Z"/></clipPath></defs><g fill="currentColor"><path class="ec-equals" d="M4.5 15H19.5A1.5 1.5 0 0 1 21 16.5V19.5A1.5 1.5 0 0 1 19.5 21H4.5A1.5 1.5 0 0 1 3 19.5V16.5A1.5 1.5 0 0 1 4.5 15ZM4.5 27H19.5A1.5 1.5 0 0 1 21 28.5V31.5A1.5 1.5 0 0 1 19.5 33H4.5A1.5 1.5 0 0 1 3 31.5V28.5A1.5 1.5 0 0 1 4.5 27Z"/><path class="ec-track" d="M28.5 9H43.5A1.5 1.5 0 0 1 45 10.5V37.5A1.5 1.5 0 0 1 43.5 39H28.5A1.5 1.5 0 0 1 27 37.5V10.5A1.5 1.5 0 0 1 28.5 9Z"/><g clip-path="url(#ec-fill-48-mono)"><rect class="ec-level" x="27" y="9" width="18" height="30"/></g></g></svg>
