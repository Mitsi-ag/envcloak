<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ec-m ec-loader-fill-16 ec-loader-fill ec-demo" style="--p:.6" role="img" aria-label="Progress"><title>Progress</title><desc>EnvCloak progress indicator, 16 px. The block fills bottom-up as determinate progress, in whole-pixel steps of 1/10. Set --p (0 to 1) on the svg and remove the ec-demo class to drive it. When complete it blinks twice and rests.</desc><style>.ec-loader-fill-16 .ec-track{opacity:0.2}.ec-loader-fill-16 .ec-level{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(var(--p,0));transition:transform 240ms cubic-bezier(0.2,0,0,1)}.ec-loader-fill-16.ec-demo .ec-level{animation:ec-loader-fill-16-level-t 5600ms linear infinite both,ec-loader-fill-16-level-o 5600ms linear infinite both}@keyframes ec-loader-fill-16-level-t{0%{transform:scaleY(0);animation-timing-function:linear}5.3571%{transform:scaleY(0);animation-timing-function:cubic-bezier(0.2,0,0,1)}9.6429%{transform:scaleY(0.2);animation-timing-function:linear}16.0714%{transform:scaleY(0.2);animation-timing-function:cubic-bezier(0.2,0,0,1)}20.3571%{transform:scaleY(0.3);animation-timing-function:linear}26.7857%{transform:scaleY(0.3);animation-timing-function:cubic-bezier(0.2,0,0,1)}31.0714%{transform:scaleY(0.6);animation-timing-function:linear}37.5%{transform:scaleY(0.6);animation-timing-function:cubic-bezier(0.2,0,0,1)}41.7857%{transform:scaleY(0.9);animation-timing-function:linear}46.4286%{transform:scaleY(0.9);animation-timing-function:cubic-bezier(0.2,0,0,1)}50.7143%{transform:scaleY(1);animation-timing-function:linear}100%{transform:scaleY(1)}}@keyframes ec-loader-fill-16-level-o{0%{opacity:1;animation-timing-function:steps(1,end)}60.1786%{opacity:0;animation-timing-function:steps(1,end)}69.6429%{opacity:1;animation-timing-function:steps(1,end)}79.1071%{opacity:0;animation-timing-function:steps(1,end)}88.5714%{opacity:1;animation-timing-function:steps(1,end)}100%{opacity:1}}@supports (opacity:round(down,.5,1)){.ec-loader-fill-16 .ec-level{transform:scaleY(calc(round(down,var(--p,0) * 10,1) / 10))}}@media (prefers-reduced-motion:reduce){.ec-loader-fill-16 *{animation:none!important;transition:none!important}}.ec-reduced .ec-loader-fill-16 *{animation:none!important;transition:none!important}</style><defs><clipPath id="ec-fill-16-mono"><path d="M9 3H15V13H9Z"/></clipPath></defs><g fill="currentColor" shape-rendering="crispEdges"><path class="ec-equals" d="M1 5H7V7H1ZM1 9H7V11H1Z"/><path class="ec-track" d="M9 3H15V13H9Z"/><g clip-path="url(#ec-fill-16-mono)"><rect class="ec-level" x="9" y="3" width="6" height="10"/></g></g></svg>
