allow-unwrap-in-tests = true
allow-expect-in-tests = true

# Legacy compatibility only in envcloak-signin/src/totp.rs. The canary in
# tests/sha1_canary.rs proves that normal workspace code cannot use it.
disallowed-types = [
  { path = "sha1::Sha1", reason = "SHA-1 is confined to RFC 6238 in envcloak-signin/src/totp.rs", allow-invalid = true },
  { path = "sha1::block_api::Sha1Core", reason = "SHA-1 is confined to RFC 6238 in envcloak-signin/src/totp.rs", allow-invalid = true },
]

# Opening a secret is allowed only in files listed in
# security/expose-allowlist.txt, which mark each call site with
# `#[allow(clippy::disallowed_methods)]`. scripts/check-unsafe.sh enforces
# the list. `allow-invalid` keeps crates that do not depend on `secrecy`
# from warning that the path does not resolve.
disallowed-methods = [
  { path = "secrecy::ExposeSecret::expose_secret", reason = "opens a secret; allowed only in files listed in security/expose-allowlist.txt", allow-invalid = true },
  { path = "secrecy::ExposeSecretMut::expose_secret_mut", reason = "opens a secret; allowed only in files listed in security/expose-allowlist.txt", allow-invalid = true },
]
