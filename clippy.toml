allow-unwrap-in-tests = true
allow-expect-in-tests = true

# Legacy compatibility only in envcloak-signin/src/totp.rs. The canary
# checks compiler refusals; check-totp-lint.sh also enforces the source
# boundary independently of secret-exposure exceptions.
disallowed-types = [
  { path = "sha1::Sha1", reason = "SHA-1 is confined to RFC 6238 in envcloak-signin/src/totp.rs", allow-invalid = true },
  { path = "sha1::block_api::Sha1Core", reason = "SHA-1 is confined to RFC 6238 in envcloak-signin/src/totp.rs", allow-invalid = true },
]

# Opening a secret is allowed only in files listed in
# security/expose-allowlist.txt, which mark each call site with
# `#[allow(clippy::disallowed_methods)]`. Signalling a process by number is
# allowed only in files listed in security/signal-allowlist.txt: EnvCloak
# signals only through an owned handle (M2 plan D-34,
# envcloak_sys::owned::OwnedChild), whose one `kill` call is in
# crates/envcloak-sys/src/owned.rs. scripts/check-unsafe.sh enforces both
# lists. `allow-invalid` keeps crates that do not depend on `secrecy`,
# `libc` or `nix` from warning that a path does not resolve.
disallowed-methods = [
  { path = "sha1::block_api::compress", reason = "SHA-1 is confined to RFC 6238 in envcloak-signin/src/totp.rs", allow-invalid = true },
  { path = "secrecy::ExposeSecret::expose_secret", reason = "opens a secret; allowed only in files listed in security/expose-allowlist.txt", allow-invalid = true },
  { path = "secrecy::ExposeSecretMut::expose_secret_mut", reason = "opens a secret; allowed only in files listed in security/expose-allowlist.txt", allow-invalid = true },
  { path = "libc::kill", reason = "signals a process by number; signal through envcloak_sys::owned::OwnedChild (M2 plan D-34); allowed only in files listed in security/signal-allowlist.txt", allow-invalid = true },
  { path = "libc::killpg", reason = "signals a process group by number; signal through envcloak_sys::owned::OwnedChild (M2 plan D-34); allowed only in files listed in security/signal-allowlist.txt", allow-invalid = true },
  { path = "envcloak_sys::signal_process", reason = "signals a process by number; signal through envcloak_sys::owned::OwnedChild (M2 plan D-34); allowed only in files listed in security/signal-allowlist.txt", allow-invalid = true },
  { path = "envcloak_sys::signal_group", reason = "signals a process group by number; signal through envcloak_sys::owned::OwnedChild (M2 plan D-34); allowed only in files listed in security/signal-allowlist.txt", allow-invalid = true },
  { path = "envcloak_sys::child::signal_process", reason = "signals a process by number; signal through envcloak_sys::owned::OwnedChild (M2 plan D-34); allowed only in files listed in security/signal-allowlist.txt", allow-invalid = true },
  { path = "envcloak_sys::child::signal_group", reason = "signals a process group by number; signal through envcloak_sys::owned::OwnedChild (M2 plan D-34); allowed only in files listed in security/signal-allowlist.txt", allow-invalid = true },
  { path = "nix::sys::signal::kill", reason = "signals a process by number; signal through envcloak_sys::owned::OwnedChild (M2 plan D-34)", allow-invalid = true },
  { path = "nix::sys::signal::killpg", reason = "signals a process group by number; signal through envcloak_sys::owned::OwnedChild (M2 plan D-34)", allow-invalid = true },
]
