[workspace]
resolver = "3"
# The canaries under security/ are members so they inherit the workspace
# lints; see scripts/check-expose-lint.sh and scripts/check-unsafe-lint.sh.
members = ["crates/*", "security/lint-canary", "security/unsafe-canary"]
# A plain `cargo build` or `cargo build --release` at the root builds these.
# They leave out envcloak-testkit, whose normal dependency on
# envcloak-sys/testing would otherwise be unified into the shipped binaries,
# and the canaries. CI builds and tests with --workspace.
default-members = [
  "crates/envcloak-agents",
  "crates/envcloak-cli",
  "crates/envcloak-core",
  "crates/envcloak-daemon",
  "crates/envcloak-exec",
  "crates/envcloak-ipc",
  "crates/envcloak-mcp",
  "crates/envcloak-policy",
  "crates/envcloak-providers",
  "crates/envcloak-proxy",
  "crates/envcloak-redact",
  "crates/envcloak-sync",
  "crates/envcloak-sys",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Mitsi-ag/envcloak"
homepage = "https://github.com/Mitsi-ag/envcloak"
authors = ["EnvCloak contributors"]

# Security-relevant crates (memory hygiene, FFI and, from T2, crypto) are
# pinned to exact versions and bumped deliberately. Others use caret
# requirements; Cargo.lock pins them and CI builds with --locked.
[workspace.dependencies]
envcloak-core = { path = "crates/envcloak-core", version = "0.1.0" }
envcloak-exec = { path = "crates/envcloak-exec", version = "0.1.0" }
envcloak-ipc = { path = "crates/envcloak-ipc", version = "0.1.0" }
envcloak-policy = { path = "crates/envcloak-policy", version = "0.1.0" }
envcloak-providers = { path = "crates/envcloak-providers", version = "0.1.0" }
envcloak-redact = { path = "crates/envcloak-redact", version = "0.1.0" }
envcloak-sys = { path = "crates/envcloak-sys", version = "0.1.0" }
# Test only, never published.
envcloak-testkit = { path = "crates/envcloak-testkit" }

libc = "=0.2.189"
secrecy = "=0.10.3"
zeroize = "=1.9.0"

# Crypto (SPEC §11). The 2026 RustCrypto majors are adopted together.
# The `zeroize` features make the ciphers, hashers and HMAC states wipe
# themselves on drop. blake2 is listed only to turn its feature on: Argon2id
# hashes the passphrase with it.
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
blake2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
blake3 = { version = "=1.8.7", default-features = false, features = ["std", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
getrandom = "=0.4.3"
hkdf = "=0.13.0"
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
subtle = { version = "=2.6.1", default-features = false }

# Vault storage (SPEC §5 "Vault"): SQLite built from the bundled amalgamation,
# so every platform runs the same, known SQLite. Only sealed bytes, keyed
# hashes and opaque ids are ever bound to a statement. `serialize` copies
# the database into an encrypted backup and verifies the copy in memory.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "serialize"] }

aho-corasick = "1.1.5"
base64 = "0.23.1"
form_urlencoded = "1.2.2"
proptest = "1.11.0"
# Provider key patterns (SPEC §8, T6): linear-time matching on bytes, and
# the pattern syntax tree the registry loader checks (no capture groups, a
# minimum match length). Unicode tables are left out; patterns are ASCII.
regex = { version = "1.13.1", default-features = false, features = ["std", "perf"] }
regex-syntax = { version = "0.8.11", default-features = false, features = ["std"] }
serde = "1.0.229"
serde_json = "1.0.151"
static_assertions = "1.1.0"
tempfile = "3.27.0"
# The project manifest parser (SPEC §5 "Project manifest"): parsing only,
# no serde and no writer. Its tables say whether they were written inline,
# which tells a binding (`{ ref = .. }`) from a profile (`[env.<name>]`).
toml_edit = { version = "0.25.15", default-features = false, features = ["parse"] }

# Every crate but envcloak-sys inherits these tables, so the compiler rejects
# unsafe code, and any `allow` of it, everywhere else. envcloak-sys repeats
# them in its own manifest with `unsafe_code = "deny"`, which its files may
# relax; scripts/check-unsafe.sh checks that the two stay identical apart
# from that one level.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(envcloak_lint_canary)", "cfg(envcloak_unsafe_canary)"] }

# disallowed_methods (clippy.toml's expose_secret ban) is an error, and its
# priority puts it after the groups that contain it, so neither
# `allow(warnings)` nor a group level can quiet it.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
disallowed_methods = "deny"
unwrap_used = "warn"
dbg_macro = "warn"

# The wiping allocator's dead-store guard (crates/envcloak-sys/tests/
# freed_memory.rs) must run optimized code, as release builds do: at
# opt-level 0 plain writes before free survive and would hide a broken wipe.
[profile.dev.package.envcloak-sys]
opt-level = 3

# Argon2id at the minimum bounds (64 MiB, 2 passes) takes seconds unoptimized
# and gate 2 seals a million times, so the crypto crates are optimized in dev
# and test builds too. envcloak-core is included because the AEAD's generic
# code is compiled into the crate that uses it; debug assertions and
# overflow checks stay on.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.envcloak-core]
opt-level = 2
# The vault hashes every row with SHA-256 at unlock and runs SQLite on every
# write; gate 5 reopens a vault after a thousand kills.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
